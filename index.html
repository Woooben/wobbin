<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScreenVault</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:#f6f6f3;color:#1c1c1a}button,input,select{font:inherit}.app{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:232px;padding:22px 14px;background:#ecece8;border-right:1px solid #ddd}.brand{display:flex;align-items:center;gap:10px;padding:0 8px 24px;font-weight:800}.logo{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#1c1c1a;color:#fff}.nav button{width:100%;display:flex;align-items:center;gap:10px;padding:11px;border:0;border-radius:9px;background:transparent;text-align:left;color:#666;cursor:pointer}.nav button.on,.nav button:hover{background:#fff;color:#111}.mini{margin-top:28px;padding:0 10px;color:#999;font-size:10px;letter-spacing:.14em}.tip{position:absolute;left:14px;right:14px;bottom:16px;padding:13px;border:1px solid #ddd;border-radius:12px;background:#fff9;font-size:11px;color:#777}.main{margin-left:232px;padding:0 30px 50px}.top{position:sticky;top:0;z-index:5;height:70px;display:flex;align-items:center;gap:12px;background:#f6f6f3e8;backdrop-filter:blur(16px);border-bottom:1px solid #e2e2dc}.search{flex:1;max-width:650px;height:40px;padding:0 13px;border:1px solid #ddd;border-radius:11px;background:#fff}.btn{height:40px;padding:0 15px;border:0;border-radius:10px;background:#1c1c1a;color:#fff;font-weight:700;cursor:pointer}.head{display:flex;align-items:end;justify-content:space-between;padding:42px 0 24px}.head small{color:#999;letter-spacing:.14em}.head h1{margin:7px 0 8px;font-size:36px;letter-spacing:-.04em}.head p{margin:0;color:#777;font-size:13px}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:22px}.filters select{height:36px;padding:0 10px;border:1px solid #ddd;border-radius:9px;background:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:28px 18px}.card{min-width:0}.shot{position:relative;width:100%;height:410px;padding:16px;border:1px solid #e1e1dc;border-radius:14px;background:#eaeae6;cursor:pointer;overflow:hidden}.shot:hover{transform:translateY(-3px);box-shadow:0 14px 30px #0001}.shot img{width:100%;height:100%;object-fit:contain;border-radius:12px}.meta{display:flex;align-items:center;gap:9px;padding:11px 2px 6px}.avatar{width:32px;height:32px;display:grid;place-items:center;border:1px solid #ddd;border-radius:9px;background:#fff;font-weight:800}.copy{min-width:0;flex:1}.copy b,.copy span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.copy b{font-size:13px}.copy span{margin-top:3px;color:#777;font-size:11px}.heart{border:0;background:transparent;font-size:20px;color:#aaa;cursor:pointer}.heart.on{color:#d44}.tags{display:flex;gap:6px}.tags span{padding:5px 7px;border-radius:6px;background:#e9e9e5;color:#777;font-size:9px}.empty{padding:90px 20px;border:1px dashed #ccc;border-radius:16px;text-align:center;color:#777}.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:#1119;backdrop-filter:blur(8px)}.panel{width:min(1050px,96vw);height:min(820px,92vh);display:flex;flex-direction:column;border-radius:18px;background:#fff;overflow:hidden}.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #eee}.bar button{border:0;background:#f1f1ee;border-radius:9px;padding:8px 11px;cursor:pointer}.view{flex:1;overflow:auto;padding:28px;background:#f5f5f2}.view img{max-width:100%;max-height:none;margin:auto;border-radius:14px;box-shadow:0 16px 40px #0003}.upload{width:min(620px,95vw);border-radius:18px;background:#fff;padding:24px}.drop{display:grid;place-items:center;min-height:150px;margin:18px 0;padding:20px;border:1px dashed #bbb;border-radius:13px;background:#f6f6f3;text-align:center;cursor:pointer}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form input,.form select{height:42px;padding:0 10px;border:1px solid #ddd;border-radius:9px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.ghost{height:40px;padding:0 15px;border:1px solid #ddd;border-radius:10px;background:#fff;cursor:pointer}@media(max-width:780px){.side{display:none}.main{margin-left:0;padding:0 14px 40px}.head h1{font-size:30px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 10px}.shot{height:280px;padding:8px}.form{grid-template-columns:1fr}.top .btn{width:42px;padding:0;font-size:0}.top .btn:after{content:"+";font-size:20px}}
</style></head><body><div id="app"></div><script>
const demo=[['Nova','个性化推荐引导','iOS','Onboarding','#f3c7aa'],['Atlas','搜索结果页','iOS','Search','#b7cdec'],['Mellow','商品详情与购买','iOS','E-commerce','#d8b08d'],['Northstar','数据概览仪表盘','Web','Dashboard','#aab6ed'],['Orbit','会员升级方案','Android','Paywall','#c2b0dc'],['Luma','消息中心','iOS','Notifications','#a9d4b7']].map((x,i)=>({id:'d'+i,app:x[0],title:x[1],platform:x[2],cat:x[3],fav:i<2,img:shot(x[0],x[1],x[4],x[2]==='Web')}));let items=[...demo],q='',platform='全部',nav='all',modal=null,upload=false;
function shot(a,t,c,web){let s=web?`<svg xmlns='http://www.w3.org/2000/svg' width='900' height='600'><rect width='900' height='600' rx='24' fill='#f1f2f5'/><rect width='180' height='600' fill='#202127'/><text x='28' y='55' fill='white' font-size='22' font-family='Arial'>${a}</text><rect x='210' y='35' width='650' height='70' rx='15' fill='white'/><text x='235' y='78' fill='#222' font-size='25' font-family='Arial'>${t}</text><rect x='210' y='135' width='400' height='420' rx='18' fill='white'/><path d='M250 480C340 400 400 455 480 335s110 30 170-80' fill='none' stroke='${c}' stroke-width='10'/><rect x='635' y='135' width='225' height='420' rx='18' fill='white'/></svg>`:`<svg xmlns='http://www.w3.org/2000/svg' width='390' height='844'><rect width='390' height='844' rx='36' fill='#f8f5ef'/><text x='28' y='90' fill='#222' font-size='30' font-weight='700' font-family='Arial'>${a}</text><text x='28' y='124' fill='#777' font-size='15' font-family='Arial'>${t}</text><rect x='28' y='170' width='334' height='230' rx='26' fill='${c}'/><circle cx='195' cy='285' r='72' fill='white' opacity='.65'/><rect x='28' y='430' width='160' height='150' rx='22' fill='white'/><rect x='202' y='430' width='160' height='150' rx='22' fill='white'/><rect x='28' y='620' width='334' height='70' rx='20' fill='white'/><rect x='28' y='748' width='334' height='60' rx='20' fill='#222'/></svg>`;return'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(s)}
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function filtered(){return items.filter(x=>(nav!=='fav'||x.fav)&&(platform==='全部'||x.platform===platform)&&([x.app,x.title,x.cat].join(' ').toLowerCase().includes(q.toLowerCase())))}
function render(){let f=filtered();document.getElementById('app').innerHTML=`<div class='app'><aside class='side'><div class='brand'><span class='logo'>✦</span>ScreenVault</div><div class='nav'><button data-nav='all' class='${nav==='all'?'on':''}'>▦　全部页面</button><button data-nav='fav' class='${nav==='fav'?'on':''}'>♥　我的收藏</button></div><div class='mini'>COLLECTIONS</div><div class='tip'>GitHub 在线演示版<br>上传内容暂存于当前浏览器</div></aside><main class='main'><header class='top'><input id='q' class='search' placeholder='搜索 App、页面类型…' value='${esc(q)}'><button id='up' class='btn'>上传截图</button></header><section class='head'><div><small>YOUR DESIGN LIBRARY</small><h1>${nav==='fav'?'我的收藏':'全部页面'}</h1><p>集中整理产品截图，快速搜索和复用设计参考。</p></div><span>${f.length} 个页面</span></section><section class='filters'><select id='pf'>${['全部','iOS','Android','Web'].map(x=>`<option ${x===platform?'selected':''}>${x}</option>`).join('')}</select></section>${f.length?`<section class='grid'>${f.map(card).join('')}</section>`:`<div class='empty'>没有找到对应截图</div>`}</main>${modal?detail(modal):''}${upload?uploadUI():''}</div>`;bind()}
function card(x){return`<article class='card'><button class='shot' data-open='${x.id}'><img src='${x.img}'></button><div class='meta'><span class='avatar'>${esc(x.app[0])}</span><div class='copy'><b>${esc(x.app)}</b><span>${esc(x.title)}</span></div><button class='heart ${x.fav?'on':''}' data-fav='${x.id}'>♥</button></div><div class='tags'><span>${esc(x.platform)}</span><span>${esc(x.cat)}</span></div></article>`}
function detail(x){return`<div class='modal' id='mb'><section class='panel'><div class='bar'><div><b>${esc(x.app)}</b> · ${esc(x.title)}</div><button id='close'>关闭</button></div><div class='view'><img src='${x.img}'></div></section></div>`}function uploadUI(){return`<div class='modal' id='ub'><section class='upload'><h2>上传产品截图</h2><label class='drop'>点击选择图片<input id='file' type='file' accept='image/*' multiple hidden></label><div class='form'><input id='appn' placeholder='App 名称'><select id='plat'><option>iOS</option><option>Android</option><option>Web</option></select><input id='title' placeholder='页面名称'><input id='cat' placeholder='页面类型'></div><div class='actions'><button id='cancel' class='ghost'>取消</button><button id='save' class='btn'>添加</button></div></section></div>`}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{nav=b.dataset.nav;render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{modal=items.find(x=>x.id===b.dataset.open);render()});document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{let x=items.find(x=>x.id===b.dataset.fav);x.fav=!x.fav;render()});qEl=document.getElementById('q');qEl.oninput=e=>{q=e.target.value;render();document.getElementById('q').focus()};document.getElementById('pf').onchange=e=>{platform=e.target.value;render()};document.getElementById('up').onclick=()=>{upload=true;render()};document.getElementById('close')&&(document.getElementById('close').onclick=()=>{modal=null;render()});document.getElementById('cancel')&&(document.getElementById('cancel').onclick=()=>{upload=false;render()});document.getElementById('save')&&(document.getElementById('save').onclick=()=>{let fs=[...document.getElementById('file').files],a=document.getElementById('appn').value||'My App',p=document.getElementById('plat').value,t=document.getElementById('title').value||'未命名页面',c=document.getElementById('cat').value||'Other';if(!fs.length)return alert('请选择图片');fs.forEach((f,i)=>items.unshift({id:Date.now()+''+i,app:a,title:t,platform:p,cat:c,fav:false,img:URL.createObjectURL(f)}));upload=false;render()})}render();
</script></body></html>
